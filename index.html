<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BLUFF // DECK" />
  <meta name="theme-color" content="#09090B" />
  <title>BLUFF // DECK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-obsidian: #09090B;
      --bg-surface: #141418;
      --bg-surface-2: #1C1C22;
      --bg-surface-3: #26262F;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #F4F4F6;
      --text-secondary: #A1A1AA;
      --text-muted: #71717A;
      --mint: #00F090;
      --indigo: #5B73F8;
      --amber: #FBBF24;
      --coral: #FF6B6B;
      --accent-active: #00F090;
      --accent-ink: #07130D;
      --radius-card: 28px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #050507;
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100%;
      overflow: hidden;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      margin: 0 auto;
      background: var(--bg-obsidian);
      display: flex;
      flex-direction: column;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      padding-left: 16px;
      padding-right: 16px;
      overflow: hidden;
    }

    @media (min-width: 520px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-shell {
        height: min(860px, 95dvh);
        border-radius: 42px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.85);
      }
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: 44px;
      flex-shrink: 0;
      margin-bottom: 12px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .icon-circle:active {
      transform: scale(0.92);
      background: var(--bg-surface-2);
    }

    .mini-brand {
      display: grid;
      grid-template-columns: repeat(2, 13px);
      gap: 3px;
      cursor: pointer;
    }

    .mini-tile {
      width: 13px;
      height: 13px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #09090B;
    }

    .timer-pill {
      position: relative;
      min-width: 88px;
      height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .timer-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      transform-origin: left center;
      pointer-events: none;
    }

    .timer-text {
      position: relative;
      z-index: 1;
    }

    .timer-pill.warn {
      border-color: rgba(251, 191, 36, 0.6);
      color: var(--amber);
      animation: pulseWarn 0.9s infinite ease-in-out;
    }

    .timer-pill.warn .timer-fill {
      background: rgba(251, 191, 36, 0.16);
    }

    .timer-pill.danger {
      border-color: rgba(255, 107, 107, 0.85);
      color: var(--coral);
      animation: heartbeat 0.55s infinite ease-in-out;
    }

    .timer-pill.danger .timer-fill {
      background: rgba(255, 107, 107, 0.22);
    }

    @keyframes pulseWarn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.1); }
      65% { transform: scale(0.98); }
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* MAIN VIEWPORT */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 12px;
    }

    /* HERO COLOR-BLOCKED CARD */
    .hero-card {
      position: relative;
      background: var(--accent-active);
      color: var(--accent-ink);
      border-radius: var(--radius-card);
      padding: 18px 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 245px;
      flex: 1.05;
      transition: background-color 0.35s cubic-bezier(0.22, 1, 0.36, 1), color 0.25s ease;
      overflow: hidden;
    }

    .hero-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 2;
    }

    .round-chip {
      background: rgba(0, 0, 0, 0.14);
      color: inherit;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.03em;
    }

    .topic-pill {
      background: rgba(0, 0, 0, 0.16);
      color: inherit;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      max-width: 195px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-turn-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.15);
      padding: 4px 10px 4px 5px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
    }

    .hero-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 4px;
      z-index: 2;
    }

    .prompt-text {
      font-size: clamp(19px, 4.8vw, 23px);
      font-weight: 800;
      line-height: 1.32;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .blank-slot {
      display: inline-block;
      min-width: 96px;
      padding: 0 8px;
      border-bottom: 3px solid currentColor;
      font-family: var(--font-mono);
      font-size: 0.88em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .giant-countdown {
      position: absolute;
      right: 16px;
      bottom: 6px;
      font-family: var(--font-mono);
      font-size: 92px;
      font-weight: 800;
      line-height: 1;
      color: rgba(0, 0, 0, 0.13);
      pointer-events: none;
      animation: popDigit 0.55s infinite ease-out;
    }

    @keyframes popDigit {
      0% { transform: scale(0.82); opacity: 0.24; }
      100% { transform: scale(1.12); opacity: 0.06; }
    }

    .timesup-overlay {
      position: absolute;
      inset: 0;
      background: var(--coral);
      color: #09090B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.04em;
      z-index: 10;
      animation: flashIn 0.2s ease-out;
    }

    @keyframes flashIn {
      from { transform: scale(1.08); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* LOWER INTERACTION DECK */
    .lower-deck {
      flex: 0.95;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-height: 0;
      overflow-y: auto;
    }

    .input-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 22px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s ease;
    }

    .input-card:focus-within {
      border-color: var(--accent-active);
    }

    .input-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .bluff-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 700;
      padding: 4px 0;
      user-select: text;
      -webkit-user-select: text;
    }

    .bluff-input::placeholder {
      color: var(--text-muted);
      font-weight: 600;
    }

    .truth-warning {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 107, 107, 0.14);
      border: 1px solid rgba(255, 107, 107, 0.4);
      color: var(--coral);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 12px;
    }

    /* VOTING GRID */
    .vote-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      flex: 1;
      align-content: start;
    }

    .vote-tile {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-tile);
      padding: 14px 12px 24px;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .vote-tile:active:not(.disabled) {
      transform: scale(0.96);
    }

    .vote-tile.selected {
      background: var(--accent-active);
      color: var(--accent-ink);
      border-color: var(--accent-active);
    }

    .vote-tile.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .tile-key {
      position: absolute;
      right: 10px;
      bottom: 7px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      opacity: 0.55;
    }

    /* BOTTOM ACTION DOCK */
    .bottom-dock {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .dock-pill-btn {
      height: 48px;
      padding: 0 15px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .dock-pill-btn:active {
      transform: scale(0.94);
      background: var(--bg-surface-2);
    }

    .dock-pill-btn.active-decoy {
      border-color: var(--amber);
      color: var(--amber);
    }

    .confirm-btn {
      flex: 1;
      height: 48px;
      border-radius: var(--radius-pill);
      border: none;
      background: var(--bg-surface-2);
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.12s ease;
    }

    .confirm-btn.ready {
      background: var(--accent-active);
      color: var(--accent-ink);
    }

    .confirm-btn.ready:active {
      transform: scale(0.97);
    }

    .confirm-btn:disabled {
      cursor: not-allowed;
    }

    /* AVATAR COMPONENT */
    .avatar-circle {
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
      color: #09090B;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    /* LOBBY & SETUP */
    .lobby-status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.16);
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 18px;
      padding: 8px 10px;
    }

    .player-name-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 700;
      min-width: 0;
      user-select: text;
      -webkit-user-select: text;
    }

    .chip-action {
      background: var(--bg-surface-2);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      border-radius: var(--radius-pill);
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip-action:active {
      transform: scale(0.95);
    }

    .cloud-bar-btn {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
      border-radius: 16px;
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }

    .cloud-bar-btn.synced {
      border-color: rgba(0, 240, 144, 0.45);
      color: var(--mint);
    }

    .cloud-bar-btn:active {
      transform: scale(0.98);
    }

    /* REVEAL LIST */
    .reveal-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reveal-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 18px;
      padding: 11px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reveal-item.truth {
      background: rgba(0, 240, 144, 0.12);
      border-color: var(--mint);
    }

    .reveal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .reveal-ans {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .reveal-item.truth .reveal-ans {
      color: var(--mint);
    }

    .reveal-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface-2);
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .reveal-item.truth .reveal-tag {
      background: var(--mint);
      color: #07130D;
    }

    .voter-chips {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .voter-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-surface-2);
      padding: 3px 8px 3px 4px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* BOTTOM SHEETS / MODALS */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .sheet-card {
      width: 100%;
      max-height: 85dvh;
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 28px;
      padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .emoji-opt {
      height: 42px;
      border-radius: 12px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-hairline);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .emoji-opt.active {
      border-color: var(--mint);
      background: rgba(0, 240, 144, 0.14);
    }

    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-swatch.active {
      border-color: #FFFFFF;
      transform: scale(1.12);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .field-input {
      width: 100%;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      padding: 11px 12px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 16px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .field-input:focus {
      border-color: var(--mint);
    }

    .seg-row {
      display: flex;
      gap: 6px;
    }

    .seg-btn {
      flex: 1;
      padding: 9px 6px;
      border-radius: 12px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .seg-btn.active {
      background: var(--mint);
      color: #07130D;
      border-color: var(--mint);
    }

    .toast {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface-3);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      z-index: 80;
      white-space: nowrap;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app"></div>

  <script>
    // =========================================================================
    // 0. SUPABASE CLOUD CREDENTIALS (Paste once here so every player auto-syncs)
    // =========================================================================
    const SUPABASE_CONFIG = {

    let audioCtx = null;
    function playTone(freq = 440, duration = 0.08, type = 'sine', gainVal = 0.06) {
      if (!state.settings.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function fisherYatesShuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeText(str) {
      return (str || '')
        .toUpperCase()
        .replace(/[^A-Z0-9\s]/g, '')
        .replace(/\b(A|AN|THE)\b/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function isTooCloseToTruth(input, promptObj) {
      const norm = normalizeText(input);
      if (!norm || !promptObj) return false;
      const truths = [promptObj.answer, ...(promptObj.accepted_truths || [])].map(normalizeText);
      return truths.some(t => t && (norm === t || (norm.length >= 4 && t.includes(norm)) || (t.length >= 4 && norm.includes(t))));

    let countdownRaf = null;
    let countdownEnd = 0;
    let countdownTotalMs = 0;
    let lastTickSecond = null;

    function stopCountdown() {
      if (countdownRaf) cancelAnimationFrame(countdownRaf);
      countdownRaf = null;
      lastTickSecond = null;
    }

    function startCountdown(onExpire) {
      stopCountdown();
      const secs = state.settings.timerSeconds;
      if (!secs || secs <= 0) {
        updateTimerDOM(null, 1);
        return;
      }
      countdownTotalMs = secs * 1000;
      countdownEnd = performance.now() + countdownTotalMs;
      lastTickSecond = secs;

      function frame(now) {
        const remainingMs = Math.max(0, countdownEnd - now);
        const remainingSec = Math.ceil(remainingMs / 1000);
        const ratio = remainingMs / countdownTotalMs;

        updateTimerDOM(remainingSec, ratio);

        if (remainingSec !== lastTickSecond && remainingSec > 0 && remainingSec <= 5) {
          playTone(remainingSec === 1 ? 880 : 620, 0.09, 'triangle', 0.08);
          const giantEl = document.getElementById('giantCountdown');
          if (giantEl) {
            giantEl.textContent = remainingSec;
            giantEl.style.display = 'block';
          }
        }
        lastTickSecond = remainingSec;

        if (remainingMs <= 0) {
          stopCountdown();
          playTone(220, 0.28, 'sawtooth', 0.09);
          onExpire();
          return;
        }
        countdownRaf = requestAnimationFrame(frame);
      }

      countdownRaf = requestAnimationFrame(frame);
    }

    function updateTimerDOM(sec, ratio) {
      const pill = document.getElementById('timerPill');
      const fill = document.getElementById('timerFill');
      const text = document.getElementById('timerText');
      if (!pill || !fill || !text) return;

      if (sec === null) {

        fill.style.transform = 'scaleX(1)';
        text.textContent = '∞';
        return;

      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      text.textContent = `${mm}:${ss}`;
      fill.style.transform = `scaleX(${Math.max(0, Math.min(1, ratio))})`;

      pill.classList.remove('warn', 'danger');
      if (sec <= 5) pill.classList.add('danger');
      else if (sec <= 10) pill.classList.add('warn');
    }

        return;
      }
      if (!window.supabase || !window.supabase.createClient) {
        if (!silent) showToast('Supabase SDK offline — using cached deck');
        return;
      }

      state.supabaseSyncing = true;
      render();

      try {
        const client = window.supabase.createClient(url, key);
        const { data, error } = await client
          .from('prompts')
          .select('id, category, prompt, answer, accepted_truths, decoys, reveal_note')
          .eq('is_active', true);

        if (error) throw error;
        if (!data || data.length === 0) throw new Error('No active prompts found in table');

        state.allPrompts = data;
        state.deckSource = 'SUPABASE';
        state.shuffledDeck = fisherYatesShuffle(data);
        state.deckCursor = 0;

        localStorage.setItem(STORAGE_KEYS.SUPABASE_CFG, JSON.stringify({ url, key }));
        localStorage.setItem(STORAGE_KEYS.SUPABASE_CACHE, JSON.stringify(data));

        state.modal = null;
        if (!silent) showToast(`Synced ${data.length} prompts from Supabase!`);
      } catch (err) {
        if (!silent) showToast(`Sync failed: ${err.message || 'Check credentials'}`);
      } finally {
        state.supabaseSyncing = false;
        render();
      }
    }

    // =========================================================================
    // 8. GAME FLOW CONTROLLERS
    // =========================================================================
    function startGame() {
      state.players.forEach((p, idx) => {
        p.score = 0;
        if (!p.name.trim()) p.name = `Player ${idx + 1}`;
      });
      if (state.shuffledDeck.length === 0 || state.deckCursor + state.settings.totalRounds > state.shuffledDeck.length) {
        state.shuffledDeck = fisherYatesShuffle(state.allPrompts);
        state.deckCursor = 0;
      }
      state.roundIndex = 0;
      beginRound();
    }

    function beginRound() {
      if (state.deckCursor >= state.shuffledDeck.length) {
        state.shuffledDeck = fisherYatesShuffle(state.allPrompts);
        state.deckCursor = 0;
      }
      state.currentPrompt = state.shuffledDeck[state.deckCursor++];
      state.bluffs = {};
      state.votes = {};
      state.activePlayerIndex = 0;
      state.decoyCursor = 0;
      state.draftBluff = '';
      state.selectedOptionId = null;

      if (state.players.length === 1) {
        enterBluffInput();
      } else {
        state.phase = 'PASS_BLUFF';
        stopCountdown();
        render();
      }
    }

    function enterBluffInput() {
      state.phase = 'BLUFF_INPUT';
      state.draftBluff = '';
      state.decoyCursor = 0;
      state.timesUpFlash = false;
      render();
      startCountdown(() => {
        state.timesUpFlash = true;
        render();
        setTimeout(() => {
          state.timesUpFlash = false;
          if (!state.draftBluff.trim() || isTooCloseToTruth(state.draftBluff, state.currentPrompt)) {
            useDecoy();
          }
          submitBluff(true);
        }, 700);
      });
    }

    function useDecoy() {
      const decoys = state.currentPrompt?.decoys || ['SOMETHING COMPLETELY UNEXPECTED'];
      const pick = decoys[state.decoyCursor % decoys.length];
      state.decoyCursor++;
      state.draftBluff = pick;
      playTone(540, 0.06, 'sine', 0.06);
      render();
    }

    function submitBluff(forced = false) {
      const player = state.players[state.activePlayerIndex];
      const cleaned = state.draftBluff.trim().toUpperCase();
      if (!cleaned) return;
      if (!forced && isTooCloseToTruth(cleaned, state.currentPrompt)) {
        playTone(200, 0.14, 'sawtooth', 0.07);
        return;
      }

      stopCountdown();
      playTone(680, 0.09, 'sine', 0.07);
      state.bluffs[player.id] = { text: cleaned };

      if (state.activePlayerIndex + 1 < state.players.length) {
        state.activePlayerIndex++;
        state.phase = 'PASS_BLUFF';
        render();
      } else {
        prepareVotingBoard();
      }
    }

    function prepareVotingBoard() {
      const options = [];
      const seenNormalized = new Set();

      const addOption = (opt) => {
        const norm = normalizeText(opt.text);
        if (!norm || seenNormalized.has(norm)) return;
        seenNormalized.add(norm);
        options.push(opt);
      };

      // 1. Real Truth
      addOption({
        id: 'truth',
        text: state.currentPrompt.answer.toUpperCase(),
        authorId: null,
        isTruth: true,
        isHouseDecoy: false
      });

      // 2. Player Bluffs
      state.players.forEach(p => {
        const b = state.bluffs[p.id];
        if (b && b.text) {
          addOption({
            id: `bluff_${p.id}`,
            text: b.text.toUpperCase(),
            authorId: p.id,
            isTruth: false,
            isHouseDecoy: false
          });
        }
      });

      // 3. Pad with House Decoys up to at least 4 cards
      const houseDecoys = fisherYatesShuffle(state.currentPrompt.decoys || []);
      for (let i = 0; i < houseDecoys.length && options.length < 4; i++) {
        addOption({
          id: `house_${i}`,
          text: houseDecoys[i].toUpperCase(),
          authorId: null,
          isTruth: false,
          isHouseDecoy: true
        });
      }

      state.voteOptions = fisherYatesShuffle(options);
      state.activePlayerIndex = 0;
      state.selectedOptionId = null;

      if (state.players.length === 1) {
        enterVoting();
      } else {
        state.phase = 'PASS_VOTE';
        stopCountdown();
        render();
      }
    }

    function enterVoting() {
      state.phase = 'VOTING';
      state.selectedOptionId = null;
      state.timesUpFlash = false;
      render();
      startCountdown(() => {
        state.timesUpFlash = true;
        render();
        setTimeout(() => {
          state.timesUpFlash = false;
          const voter = state.players[state.activePlayerIndex];
          const valid = state.voteOptions.filter(o => o.authorId !== voter.id);
          if (valid.length > 0 && !state.selectedOptionId) {
            state.selectedOptionId = valid[Math.floor(Math.random() * valid.length)].id;
          }
          submitVote();
        }, 700);
      });
    }

    function submitVote() {
      if (!state.selectedOptionId) return;
      stopCountdown();
      playTone(740, 0.09, 'sine', 0.07);
      const voter = state.players[state.activePlayerIndex];
      state.votes[voter.id] = state.selectedOptionId;

      if (state.activePlayerIndex + 1 < state.players.length) {
        state.activePlayerIndex++;
        state.phase = 'PASS_VOTE';
        render();
      } else {
        scoreRound();
      }
    }

    function scoreRound() {
      stopCountdown();
      state.players.forEach(voter => {
        const pickedId = state.votes[voter.id];
        const chosenOpt = state.voteOptions.find(o => o.id === pickedId);
        if (!chosenOpt) return;
        if (chosenOpt.isTruth) {
          voter.score += 1000;
        } else if (chosenOpt.authorId) {
          const author = state.players.find(p => p.id === chosenOpt.authorId);
          if (author && author.id !== voter.id) {
            author.score += 500;
          }
        }
      });
      state.phase = 'REVEAL';
      playTone(523.25, 0.12, 'triangle', 0.08);
      setTimeout(() => playTone(659.25, 0.16, 'triangle', 0.08), 110);
      render();
    }

    function advanceAfterReveal() {
      if (state.roundIndex + 1 < state.settings.totalRounds) {
        state.roundIndex++;
        beginRound();
      } else {
        state.phase = 'PODIUM';
        render();
      }
    }

    function formatPromptHtml(promptText, filledWord = null) {
      const safe = escapeHtml(promptText || '');
      const slot = filledWord
        ? `<span class="blank-slot">${escapeHtml(filledWord)}</span>`
        : `<span class="blank-slot">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
      return safe.replace(/_{3,}/g, slot);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

                    <span style="font-weight:800;font-size:15px;">${escapeHtml(p.name)}</span>
                  </div>
                  <span style="font-family:var(--font-mono);font-weight:800;color:var(--mint);">${p.score.toLocaleString()}</span>
                </div>
              `).join('')}
            </div>
          </section>

          <div class="bottom-dock">
            <button class="dock-pill-btn" onclick="returnToLobby()">LOBBY</button>
            <button class="confirm-btn ready" onclick="startGame()">Play Again (New Cards)</button>
          </div>
        </div>
      `;
    }

    function renderModal() {
      if (!state.modal) return '';

      if (state.modal === 'AVATAR') {
        const player = state.players.find(p => p.id === state.editingPlayerId);
        if (!player) return '';
        return `
          <div class="sheet-backdrop" onclick="if(event.target===this) closeModal()">
            <div class="sheet-card">
              <div class="sheet-header">
                <h3 class="sheet-title">Customize ${escapeHtml(player.name)}</h3>
                <button class="chip-action" onclick="closeModal()">Done</button>
              </div>
              <div style="display:flex;justify-content:center;padding:4px 0;">
                ${renderAvatar(player, 68)}
              </div>
              <div class="seg-row">
                <button class="seg-btn ${player.avatarType === 'emoji' ? 'active' : ''}" onclick="setAvatarType('${player.id}', 'emoji')">Emoji</button>
                <button class="seg-btn ${player.avatarType === 'initials' ? 'active' : ''}" onclick="setAvatarType('${player.id}', 'initials')">Initials</button>
              </div>
              <div class="color-row">
                ${AVATAR_COLORS.map(c => `
                  <button class="color-swatch ${player.avatarColor === c ? 'active' : ''}" style="background:${c};" onclick="setAvatarColor('${player.id}', '${c}')"></button>
                `).join('')}
              </div>
              ${player.avatarType === 'emoji' ? `
                <div class="emoji-grid">
                  ${AVATAR_EMOJIS.map(em => `
                    <button class="emoji-opt ${player.avatarValue === em ? 'active' : ''}" onclick="setAvatarEmoji('${player.id}', '${em}')">${em}</button>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      if (state.modal === 'SUPABASE') {
        return `
          <div class="sheet-backdrop" onclick="if(event.target===this) closeModal()">
            <div class="sheet-card">
              <div class="sheet-header">
                <h3 class="sheet-title">☁️ Supabase Cloud Deck</h3>
                <button class="chip-action" onclick="closeModal()">✕</button>
              </div>
              <p style="margin:0;font-size:13px;color:var(--text-secondary);line-height:1.45;">
                Connect your Supabase PostgreSQL project to stream all active prompts directly from <code style="color:var(--mint);">public.prompts</code>.
              </p>
              <div class="field-group">
                <label>Project URL</label>
                <input class="field-input" placeholder="https://xyzcompany.supabase.co" value="${escapeHtml(state.supabaseConfig.url)}" oninput="state.supabaseConfig.url=this.value" />
              </div>
              <div class="field-group">
                <label>Publishable Key (sb_publishable_...)</label>
                <input class="field-input" placeholder="sb_publishable_..." value="${escapeHtml(state.supabaseConfig.key)}" oninput="state.supabaseConfig.key=this.value" />
              </div>
              <button class="confirm-btn ready" onclick="syncFromSupabase(false)" ${state.supabaseSyncing ? 'disabled' : ''}>
                ${state.supabaseSyncing ? 'Syncing Database...' : 'Save & Sync Prompts'}
              </button>
            </div>
          </div>
        `;
      }

      if (state.modal === 'SETTINGS') {
        return `
          <div class="sheet-backdrop" onclick="if(event.target===this) closeModal()">
            <div class="sheet-card">
              <div class="sheet-header">
                <h3 class="sheet-title">Game Settings</h3>
                <button class="chip-action" onclick="closeModal()">Done</button>
              </div>
              <div class="field-group">
                <label>Rounds Per Game</label>
                <div class="seg-row">
                  ${[3, 5, 7, 10].map(r => `
                    <button class="seg-btn ${state.settings.totalRounds === r ? 'active' : ''}" onclick="state.settings.totalRounds=${r};render()">${r}</button>
                  `).join('')}
                </div>
              </div>
              <div class="field-group">
                <label>Countdown Timer</label>
                <div class="seg-row">
                  ${[30, 45, 60, 0].map(t => `
                    <button class="seg-btn ${state.settings.timerSeconds === t ? 'active' : ''}" onclick="state.settings.timerSeconds=${t};render()">${t === 0 ? 'OFF' : `${t}s`}</button>
                  `).join('')}
                </div>
              </div>
              <div class="field-group">
                <label>Sound Effects</label>
                <div class="seg-row">
                  <button class="seg-btn ${state.settings.soundEnabled ? 'active' : ''}" onclick="state.settings.soundEnabled=true;render()">ON</button>
                  <button class="seg-btn ${!state.settings.soundEnabled ? 'active' : ''}" onclick="state.settings.soundEnabled=false;render()">OFF</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (state.modal === 'HELP') {
        return `
          <div class="sheet-backdrop" onclick="if(event.target===this) closeModal()">
            <div class="sheet-card">
              <div class="sheet-header">
                <h3 class="sheet-title">How to Play & iPhone Install</h3>
                <button class="chip-action" onclick="closeModal()">Got It</button>
              </div>
              <p style="margin:0;font-size:13px;color:var(--text-secondary);line-height:1.5;">
                <strong>1. Write a Lie:</strong> Every round deals a completely random fill-in-the-blank fact. Type a convincing fake answer—or tap <strong>DECOY</strong> if you're stuck.<br><br>
                <strong>2. Fool Everyone:</strong> All lies are mixed with the real answer. Earn <strong>+1,000 pts</strong> for spotting the truth and <strong>+500 pts</strong> for every player who falls for your lie.<br><br>
                <strong>3. iPhone Home Screen App:</strong> Open this page in Safari, tap the <strong>Share</strong> icon, and select <strong>Add to Home Screen</strong> for full-screen app mode.
              </p>
            </div>
          </div>
        `;
      }

      // MENU DRAWER
      return `
        <div class="sheet-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="sheet-card">
            <div class="sheet-header">
              <h3 class="sheet-title">BLUFF // DECK</h3>
              <button class="chip-action" onclick="closeModal()">✕</button>
            </div>
            <button class="cloud-bar-btn" style="padding:13px 14px;" onclick="closeModal();returnToLobby();">
              <span>🏠 Return to Lobby</span>
            </button>
            <button class="cloud-bar-btn ${state.deckSource === 'SUPABASE' ? 'synced' : ''}" style="padding:13px 14px;" onclick="openModal('SUPABASE')">
              <span>☁️ Supabase Cloud (${state.allPrompts.length} prompts)</span>
              <span style="font-family:var(--font-mono);font-size:11px;">SYNC ↻</span>
            </button>
            <button class="cloud-bar-btn" style="padding:13px 14px;" onclick="openModal('SETTINGS')">
              <span>⚙️ Round & Timer Settings</span>
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. EVENT HANDLERS & MAIN RENDER LOOP
    // =========================================================================
    function handleBluffTyping(val) {
      state.draftBluff = val;
      const promptEl = document.querySelector('.prompt-text');
      if (promptEl && state.currentPrompt) {
        promptEl.innerHTML = formatPromptHtml(state.currentPrompt.prompt, val.trim());
      }
      const tooClose = isTooCloseToTruth(val, state.currentPrompt);
      const isReady = val.trim().length > 0 && !tooClose;
      const btn = document.getElementById('confirmBluffBtn');
      if (btn) {
        btn.disabled = !isReady;
        btn.classList.toggle('ready', isReady);
      }
      const card = document.querySelector('.input-card');
      if (card) {
        let warn = card.querySelector('.truth-warning');
        if (tooClose && !warn) {
          warn = document.createElement('div');
          warn.className = 'truth-warning';
          warn.textContent = '⚠️ Too close to the real answer! Write a fake lie instead.';
          card.appendChild(warn);
        } else if (!tooClose && warn) {
          warn.remove();
        }
      }
    }

    function selectVoteOption(optId) {
      state.selectedOptionId = optId;
      playTone(580, 0.05, 'sine', 0.05);
      render();
    }

    function addPlayer() {
      if (state.players.length >= 8) return;
      const idx = state.players.length;
      state.players.push({
        id: `p_${Date.now()}_${idx}`,
        name: `Player ${idx + 1}`,
        avatarType: 'emoji',
        avatarValue: AVATAR_EMOJIS[idx % AVATAR_EMOJIS.length],
        avatarColor: AVATAR_COLORS[idx % AVATAR_COLORS.length],
        score: 0
      });
      render();
    }

    function removePlayer(id) {
      if (state.players.length <= 1) return;
      state.players = state.players.filter(p => p.id !== id);
      render();
    }

    function updatePlayerName(id, val) {
      const p = state.players.find(x => x.id === id);
      if (p) p.name = val;
    }

    function openAvatarStudio(playerId) {
      state.editingPlayerId = playerId;
      state.modal = 'AVATAR';
      render();
    }

    function setAvatarType(id, type) {
      const p = state.players.find(x => x.id === id);
      if (p) { p.avatarType = type; render(); }
    }

    function setAvatarColor(id, color) {
      const p = state.players.find(x => x.id === id);
      if (p) { p.avatarColor = color; render(); }
    }

    function setAvatarEmoji(id, emoji) {
      const p = state.players.find(x => x.id === id);
      if (p) { p.avatarValue = emoji; render(); }
    }

    function openModal(name) {
      state.modal = name;
      render();
    }

    function closeModal() {
      state.modal = null;
      render();
    }

    function returnToLobby() {
      stopCountdown();
      state.phase = 'LOBBY';
      render();
    }

    function render() {
      const theme = getActiveTheme();
      document.documentElement.style.setProperty('--accent-active', theme.bg);
      document.documentElement.style.setProperty('--accent-ink', theme.ink);

      let screenHtml = '';
      switch (state.phase) {
        case 'LOBBY': screenHtml = renderLobby(); break;
        case 'PASS_BLUFF': screenHtml = renderPassCurtain('PASS_BLUFF'); break;
        case 'BLUFF_INPUT': screenHtml = renderBluffInput(); break;
        case 'PASS_VOTE': screenHtml = renderPassCurtain('PASS_VOTE'); break;
        case 'VOTING': screenHtml = renderVoting(); break;
        case 'REVEAL': screenHtml = renderReveal(); break;
        case 'PODIUM': screenHtml = renderPodium(); break;
      }

      const app = document.getElementById('app');
      app.innerHTML = `
        ${renderTopBar()}
        ${screenHtml}
        ${renderModal()}
        ${state.toastMessage ? `<div class="toast">${escapeHtml(state.toastMessage)}</div>` : ''}
      `;
    }

    // Boot
    initApplePWA();
    hydrateFromStorage();
    render();
    if (state.supabaseConfig.url && state.supabaseConfig.key) {
      syncFromSupabase(true);
    }
  </script>
</body>
</html>
